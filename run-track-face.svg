<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" width="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .track-outer { fill: none; stroke: #374151; stroke-width: 34; }
    .track-lane  { fill: none; stroke: #60a5fa; stroke-width: 1; stroke-dasharray: 4 8; opacity: 0.6; }
    .finish { stroke: #fbbf24; stroke-width: 4; }
    .finish-text { fill: #fbbf24; font-family:'Courier New',monospace; font-size:11px; font-weight:bold; }

    .glow { fill: #fbbf24; opacity: 0.3; animation: touch-glow 7s ease-in-out infinite; }
    @keyframes touch-glow {
      0%   { opacity: 0.3; transform: scale(1); }
      4%   { opacity: 1;   transform: scale(1.35); }
      8%   { opacity: 0.3; transform: scale(1); }
      100% { opacity: 0.3; transform: scale(1); }
    }
    .node { fill: #0d1117; stroke: #60a5fa; stroke-width: 2; }
    .cp-label { fill: #60a5fa; font-family:'Courier New',monospace; font-size:9px; text-anchor: middle; }

    .runner-path {
      animation: run-order 7s linear infinite;
    }
    @keyframes run-order {
      0%   { transform: translate(60px,150px); }
      15%  { transform: translate(320px,260px); }
      20%  { transform: translate(320px,260px); }
      35%  { transform: translate(545px,205px); }
      40%  { transform: translate(545px,205px); }
      55%  { transform: translate(545px,95px); }
      60%  { transform: translate(545px,95px); }
      75%  { transform: translate(320px,40px); }
      80%  { transform: translate(320px,40px); }
      95%  { transform: translate(95px,95px); }
      100% { transform: translate(60px,150px); }
    }

    .face-flip { animation: flip 7s steps(1) infinite; }
    @keyframes flip {
      0%, 61%  { transform: scaleX(1); }
      62%, 99% { transform: scaleX(-1); }
      100%     { transform: scaleX(1); }
    }

    .squash { transform-origin: 0px 40px; animation: bounce 0.32s ease-in-out infinite; }
    @keyframes bounce {
      0%,100% { transform: scaleY(1); }
      50%     { transform: scaleY(0.92) translateY(2px); }
    }
    .leg-l { transform-origin: -4px 4px; animation: sl 0.32s ease-in-out infinite; }
    .leg-r { transform-origin: 4px 4px;  animation: sr 0.32s ease-in-out infinite; }
    .arm-l { transform-origin: -6px -28px; animation: sr 0.32s ease-in-out infinite; }
    @keyframes sl { 0%,100% { transform: rotate(32deg); } 50% { transform: rotate(-32deg); } }
    @keyframes sr { 0%,100% { transform: rotate(-32deg); } 50% { transform: rotate(32deg); } }

    /* touch arm: reaches out as the runner passes each checkpoint */
    .arm-touch { transform-origin: 6px -28px; animation: reach 7s ease-in-out infinite; }
    @keyframes reach {
      0%,12%,18%,32%,38%,52%,58%,72%,78%,92%,98%,100% { transform: rotate(-20deg) scale(1); }
      15%,35%,55%,75%,95% { transform: rotate(70deg) scale(1.3); }
    }
  </style>

  <!-- track -->
  <ellipse class="track-outer" cx="320" cy="150" rx="260" ry="110"/>
  <ellipse class="track-lane" cx="320" cy="150" rx="260" ry="110"/>
  <line class="finish" x1="60" y1="132" x2="60" y2="168"/>
  <text class="finish-text" x="28" y="120">START</text>

  <!-- checkpoints: label inside each node -->
  <g>
    <circle class="glow" cx="320" cy="260" r="30" style="animation-delay:-1.05s"/>
    <circle class="node" cx="320" cy="260" r="22"/>
    <text class="cp-label" x="320" y="264">HTML</text>
  </g>
  <g>
    <circle class="glow" cx="545" cy="205" r="30" style="animation-delay:-2.45s"/>
    <circle class="node" cx="545" cy="205" r="24"/>
    <text class="cp-label" x="545" y="202"><tspan x="545" dy="-2">Full Stack</tspan><tspan x="545" dy="11">Dev</tspan></text>
  </g>
  <g>
    <circle class="glow" cx="545" cy="95" r="30" style="animation-delay:-3.85s"/>
    <circle class="node" cx="545" cy="95" r="22"/>
    <text class="cp-label" x="545" y="99">DSA</text>
  </g>
  <g>
    <circle class="glow" cx="320" cy="40" r="30" style="animation-delay:-5.25s"/>
    <circle class="node" cx="320" cy="40" r="24"/>
    <text class="cp-label" x="320" y="37"><tspan x="320" dy="-2">System</tspan><tspan x="320" dy="11">Design</tspan></text>
  </g>
  <g>
    <circle class="glow" cx="95" cy="95" r="32" style="animation-delay:-6.65s"/>
    <circle class="node" cx="95" cy="95" r="26"/>
    <text class="cp-label" x="95" y="92"><tspan x="95" dy="-2">AI Native</tspan><tspan x="95" dy="11">Products</tspan></text>
  </g>

  <!-- bearded runner -->
  <g class="runner-path">
    <g class="face-flip">
      <g class="squash">
        <line class="arm-l"     x1="-6" y1="-28" x2="-14" y2="-14" stroke="#60a5fa" stroke-width="5" stroke-linecap="round"/>
        <line class="arm-touch" x1="6"  y1="-28" x2="14"  y2="-14" stroke="#60a5fa" stroke-width="5" stroke-linecap="round"/>
        <line class="leg-l" x1="-4" y1="4" x2="-12" y2="24" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
        <line class="leg-r" x1="4"  y1="4" x2="12"  y2="24" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
        <rect x="-4" y="20" width="8" height="6" rx="1" fill="#fbbf24"/>
        <rect x="4"  y="20" width="8" height="6" rx="1" fill="#fbbf24"/>

        <rect x="-9" y="-32" width="18" height="34" rx="6" fill="#9ca3af"/>

        <circle cx="0" cy="-42" r="10" fill="#9ca3af"/>
        <path d="M -8,-38 Q 0,-26 8,-38 Q 6,-30 0,-29 Q -6,-30 -8,-38 Z" fill="#374151"/>
        <circle cx="-3.5" cy="-44" r="1.3" fill="#374151"/>
        <circle cx="3.5"  cy="-44" r="1.3" fill="#374151"/>
      </g>
    </g>
  </g>
</svg>
